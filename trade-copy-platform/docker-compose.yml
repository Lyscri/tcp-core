services:

  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: tradecopier-postgres
    environment:
      POSTGRES_DB: tradecopier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradecopier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: tradecopier-kafka
    environment:
      # Configuraciones para modo KRaft (sin Zookeeper)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://tradecopier-kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@tradecopier-kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=6
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: tradecopier-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    environment:
      CLICKHOUSE_DB: tradecopier
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Microservices ─────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/auth-service
    container_name: tradecopier-auth
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@tradecopier-postgres:5432/tradecopier
      REDIS_URL: redis://tradecopier-redis:6379
      JWT_SECRET: dev-secret-change-this
      KAFKA_BROKERS: tradecopier-kafka:9092
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/account-service
    container_name: tradecopier-account
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@tradecopier-postgres:5432/tradecopier
      REDIS_URL: redis://tradecopier-redis:6379
      KAFKA_BROKERS: tradecopier-kafka:9092
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  trade-sync-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/trade-sync-engine
    container_name: tradecopier-trade-sync
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@tradecopier-postgres:5432/tradecopier
      REDIS_URL: redis://tradecopier-redis:6379
      KAFKA_BROKERS: tradecopier-kafka:9092
      ACCOUNT_SERVICE_URL: http://tradecopier-account:3002
      RISK_ENGINE_URL: http://risk-engine:3004
      BROKER_ADAPTER_URL: http://broker-adapters:3005
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  risk-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/risk-engine
    container_name: tradecopier-risk
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@tradecopier-postgres:5432/tradecopier
      REDIS_URL: redis://tradecopier-redis:6379
      KAFKA_BROKERS: tradecopier-kafka:9092
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  broker-adapters:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/broker-adapters
    container_name: tradecopier-broker
    environment:
      PORT: 3005
      REDIS_URL: redis://tradecopier-redis:6379
      KAFKA_BROKERS: tradecopier-kafka:9092
    ports:
      - "3005:3005"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/analytics-service
    container_name: tradecopier-analytics
    environment:
      PORT: 3006
      CLICKHOUSE_URL: http://tradecopier-clickhouse:8123
      REDIS_URL: redis://tradecopier-redis:6379
      KAFKA_BROKERS: tradecopier-kafka:9092
    ports:
      - "3006:3006"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/payment-service
    container_name: tradecopier-payment
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://postgres:postgres@tradecopier-postgres:5432/tradecopier
      REDIS_URL: redis://tradecopier-redis:6379
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/admin-service
    container_name: tradecopier-admin
    environment:
      PORT: 3008
      DATABASE_URL: postgresql://postgres:postgres@tradecopier-postgres:5432/tradecopier
      REDIS_URL: redis://tradecopier-redis:6379
      CLICKHOUSE_URL: http://tradecopier-clickhouse:8123
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  websocket-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/websocket-gateway
    container_name: tradecopier-ws
    environment:
      PORT: 3009
      REDIS_URL: redis://tradecopier-redis:6379
      KAFKA_BROKERS: tradecopier-kafka:9092
      JWT_SECRET: dev-secret-change-this
    ports:
      - "3009:3009"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/api-gateway
    container_name: tradecopier-api
    environment:
      PORT: 3000
      REDIS_URL: redis://tradecopier-redis:6379
      JWT_SECRET: dev-secret-change-this
      AUTH_SERVICE_URL: http://tradecopier-auth:3001
      ACCOUNT_SERVICE_URL: http://tradecopier-account:3002
      TRADE_SYNC_URL: http://tradecopier-trade-sync:3003
      RISK_ENGINE_URL: http://tradecopier-risk:3004
      BROKER_ADAPTER_URL: http://tradecopier-broker:3005
      ANALYTICS_SERVICE_URL: http://tradecopier-analytics:3006
      PAYMENT_SERVICE_URL: http://tradecopier-payment:3007
      ADMIN_SERVICE_URL: http://tradecopier-admin:3008
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  clickhouse_data: